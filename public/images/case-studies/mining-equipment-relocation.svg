<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f4a"/>
      <stop offset="100%" stop-color="#2e4a6a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2e1a"/>
      <stop offset="100%" stop-color="#2a1e0e"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3820"/>
      <stop offset="100%" stop-color="#3a2a12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Distant hills / open-cut mine pit terraces -->
  <path d="M0 280 Q200 240 400 260 Q600 280 800 250 L800 450 L0 450Z" fill="url(#hill)"/>
  <path d="M0 310 Q150 290 300 300 Q450 310 600 295 Q700 285 800 300 L800 450 L0 450Z" fill="#3a2a12"/>
  <!-- Mine pit terraces -->
  <path d="M50 300 Q200 288 350 296 Q500 304 650 292 Q720 287 800 296" fill="none" stroke="#5a4422" stroke-width="2"/>
  <path d="M30 320 Q180 308 330 316 Q480 324 630 312 Q710 306 800 316" fill="none" stroke="#5a4422" stroke-width="1.5"/>

  <!-- Ground -->
  <rect x="0" y="370" width="800" height="80" fill="url(#ground)"/>
  <!-- Dirt road tracks -->
  <path d="M0 420 Q200 415 400 418 Q600 421 800 416" fill="none" stroke="#5a4020" stroke-width="3" stroke-dasharray="20,15"/>

  <!-- Low-loader trailer (large, centre) carrying excavator -->
  <!-- Trailer -->
  <rect x="80" y="350" width="520" height="28" rx="3" fill="#1a2e4a"/>
  <!-- Trailer wheels (many axles) -->
  <ellipse cx="120" cy="382" rx="14" ry="14" fill="#0d1a2a"/>
  <ellipse cx="120" cy="382" rx="8" ry="8" fill="#1a2e4a"/>
  <ellipse cx="165" cy="382" rx="14" ry="14" fill="#0d1a2a"/>
  <ellipse cx="165" cy="382" rx="8" ry="8" fill="#1a2e4a"/>
  <ellipse cx="300" cy="382" rx="14" ry="14" fill="#0d1a2a"/>
  <ellipse cx="300" cy="382" rx="8" ry="8" fill="#1a2e4a"/>
  <ellipse cx="345" cy="382" rx="14" ry="14" fill="#0d1a2a"/>
  <ellipse cx="345" cy="382" rx="8" ry="8" fill="#1a2e4a"/>
  <ellipse cx="490" cy="382" rx="14" ry="14" fill="#0d1a2a"/>
  <ellipse cx="490" cy="382" rx="8" ry="8" fill="#1a2e4a"/>
  <ellipse cx="535" cy="382" rx="14" ry="14" fill="#0d1a2a"/>
  <ellipse cx="535" cy="382" rx="8" ry="8" fill="#1a2e4a"/>

  <!-- Mining excavator on trailer -->
  <!-- Undercarriage/tracks -->
  <rect x="200" y="330" width="220" height="22" rx="6" fill="#2a4020"/>
  <rect x="195" y="334" width="230" height="14" rx="4" fill="#1e3018"/>
  <!-- Track detail -->
  <line x1="210" y1="340" x2="415" y2="340" stroke="#2a4020" stroke-width="3" stroke-dasharray="12,6"/>
  <!-- Upper body -->
  <rect x="210" y="285" width="200" height="48" rx="4" fill="#d4861a"/>
  <!-- Cab -->
  <rect x="340" y="268" width="70" height="66" rx="4" fill="#c07818"/>
  <!-- Cab windows -->
  <rect x="348" y="274" width="28" height="20" rx="2" fill="#4a7aa0" fill-opacity="0.7"/>
  <rect x="382" y="274" width="18" height="20" rx="2" fill="#4a7aa0" fill-opacity="0.5"/>
  <!-- Engine hood detail -->
  <rect x="215" y="290" width="120" height="10" rx="2" fill="#bf7a14"/>
  <rect x="215" y="305" width="120" height="6" rx="2" fill="#bf7a14"/>
  <!-- Boom arm -->
  <line x1="250" y1="290" x2="170" y2="210" stroke="#c07818" stroke-width="12" stroke-linecap="round"/>
  <line x1="170" y1="210" x2="140" y2="280" stroke="#b06a10" stroke-width="10" stroke-linecap="round"/>
  <!-- Bucket -->
  <path d="M120 278 L160 282 L155 300 L115 296Z" fill="#a06010"/>
  <!-- Counterweight -->
  <rect x="410" y="285" width="20" height="30" rx="2" fill="#a06010"/>
  <!-- Hydraulic lines -->
  <line x1="250" y1="290" x2="220" y2="285" stroke="#666" stroke-width="2"/>
  <line x1="170" y1="210" x2="160" y2="240" stroke="#666" stroke-width="2"/>

  <!-- Prime mover truck cab -->
  <rect x="560" y="322" width="90" height="56" rx="5" fill="#0d2240"/>
  <rect x="600" y="308" width="55" height="20" rx="3" fill="#0d2240"/>
  <!-- Windshield -->
  <rect x="568" y="328" width="55" height="28" rx="2" fill="#2a4f7a" fill-opacity="0.7"/>
  <!-- Headlights -->
  <ellipse cx="645" cy="358" rx="6" ry="6" fill="#ffee88" fill-opacity="0.9"/>
  <ellipse cx="645" cy="340" rx="5" ry="4" fill="#ffee88" fill-opacity="0.6"/>
  <!-- Truck wheels -->
  <ellipse cx="590" cy="382" rx="16" ry="16" fill="#0d1a2a"/>
  <ellipse cx="590" cy="382" rx="9" ry="9" fill="#1a2e4a"/>
  <ellipse cx="640" cy="382" rx="16" ry="16" fill="#0d1a2a"/>
  <ellipse cx="640" cy="382" rx="9" ry="9" fill="#1a2e4a"/>

  <!-- Dust cloud behind truck -->
  <ellipse cx="70" cy="400" rx="50" ry="20" fill="#5a4020" fill-opacity="0.3"/>
  <ellipse cx="50" cy="385" rx="35" ry="15" fill="#5a4020" fill-opacity="0.2"/>

  <!-- Safety flags on transport -->
  <line x1="80" y1="350" x2="80" y2="320" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="80" y="320" width="20" height="12" fill="#f07b2b"/>
  <line x1="600" y1="322" x2="600" y2="292" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="580" y="292" width="20" height="12" fill="#f07b2b"/>

  <!-- Pilot vehicle (small truck in front) -->
  <rect x="690" y="360" width="70" height="28" rx="4" fill="#1a3050"/>
  <rect x="720" y="350" width="44" height="14" rx="3" fill="#1a3050"/>
  <ellipse cx="705" cy="392" rx="12" ry="12" fill="#0d1a2a"/>
  <ellipse cx="705" cy="392" rx="7" ry="7" fill="#1a2e4a"/>
  <ellipse cx="748" cy="392" rx="12" ry="12" fill="#0d1a2a"/>
  <ellipse cx="748" cy="392" rx="7" ry="7" fill="#1a2e4a"/>
  <rect x="756" y="363" width="6" height="6" rx="1" fill="#ffee88" fill-opacity="0.9"/>
  <!-- Pilot vehicle beacon -->
  <ellipse cx="720" cy="350" rx="6" ry="4" fill="#f07b2b" fill-opacity="0.9"/>

  <!-- Orange accent line -->
  <rect x="0" y="445" width="800" height="5" fill="#f07b2b"/>

  <!-- Label -->
  <rect x="24" y="24" width="272" height="40" rx="6" fill="#000000" fill-opacity="0.4"/>
  <text x="36" y="49" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Mining Equipment Relocation</text>
</svg>
