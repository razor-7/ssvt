<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Midday arid sky: bright blue top → hazy dusty horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e2040"/>
      <stop offset="20%"  stop-color="#162a50"/>
      <stop offset="42%"  stop-color="#1e3a62"/>
      <stop offset="62%"  stop-color="#2a4a72"/>
      <stop offset="78%"  stop-color="#3a4a60"/>
      <stop offset="90%"  stop-color="#5a4a30"/>
      <stop offset="100%" stop-color="#7a6040"/>
    </linearGradient>
    <!-- Sun glow (high, harsh midday) -->
    <radialGradient id="sunGlow" cx="78%" cy="30%" r="25%">
      <stop offset="0%"   stop-color="#ffffa0" stop-opacity="0.55"/>
      <stop offset="20%"  stop-color="#e8d070" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#c0a840" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c0a840" stop-opacity="0"/>
    </radialGradient>
    <!-- Horizon dust haze -->
    <linearGradient id="dustHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a6040" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#6a5030" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5a4020" stop-opacity="0"/>
    </linearGradient>
    <!-- Dust cloud (behind convoy) -->
    <radialGradient id="dustCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8a6a40" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#7a5a30" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7a5a30" stop-opacity="0"/>
    </radialGradient>
    <!-- Open-cut terrain: red-brown earth -->
    <linearGradient id="terrainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a3820"/>
      <stop offset="100%" stop-color="#3a2a12"/>
    </linearGradient>
    <linearGradient id="terrainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a4028"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#483818"/>
      <stop offset="100%" stop-color="#2e2008"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect width="800" height="450" fill="url(#sunGlow)"/>

  <!-- Sky clouds (sparse, bright desert cumulus) -->
  <ellipse cx="100" cy="65"  rx="90"  ry="22" fill="#2a3a55" fill-opacity="0.50"/>
  <ellipse cx="168" cy="50"  rx="70"  ry="17" fill="#2a3a55" fill-opacity="0.55"/>
  <ellipse cx="55"  cy="72"  rx="50"  ry="14" fill="#2a3a55" fill-opacity="0.42"/>
  <ellipse cx="410" cy="50"  rx="115" ry="28" fill="#2a3a55" fill-opacity="0.48"/>
  <ellipse cx="500" cy="36"  rx="85"  ry="20" fill="#2a3a55" fill-opacity="0.52"/>
  <ellipse cx="340" cy="60"  rx="70"  ry="18" fill="#2a3a55" fill-opacity="0.42"/>

  <!-- Horizon dust haze -->
  <rect x="0" y="235" width="800" height="65" fill="url(#dustHaze)"/>

  <!-- ═══ OPEN-CUT MINE PIT TERRAIN ═══ -->
  <!-- Far mine walls / benches (receding into distance) -->
  <path d="M0 258 Q200 235 400 248 Q600 260 800 238 L800 450 L0 450Z" fill="url(#terrainFar)"/>
  <path d="M0 285 Q160 272 320 280 Q480 288 640 274 Q720 268 800 278 L800 450 L0 450Z" fill="#3e2e14"/>
  <!-- Mine bench terrace lines (horizontal cuts) -->
  <path d="M0 256 Q200 233 400 246 Q600 258 800 236" fill="none" stroke="#6a5028" stroke-width="2"/>
  <path d="M0 270 Q180 255 360 265 Q540 275 720 260 Q760 257 800 262" fill="none" stroke="#6a5028" stroke-width="1.5"/>
  <path d="M0 285 Q160 272 320 280 Q480 288 640 274 Q740 268 800 277" fill="none" stroke="#5a4020" stroke-width="1.5"/>
  <path d="M0 302 Q140 292 280 298 Q420 304 560 294 Q680 287 800 296" fill="none" stroke="#5a4020" stroke-width="1.2"/>

  <!-- Near ground (dirt access road level) -->
  <rect x="0" y="360" width="800" height="90" fill="url(#ground)"/>

  <!-- Road / tyre tracks (compressed earth) -->
  <path d="M0 420 Q200 416 400 419 Q600 422 800 418" fill="none" stroke="#5a4020" stroke-width="4" stroke-dasharray="24 14"/>
  <path d="M0 410 Q200 406 400 409 Q600 412 800 408" fill="none" stroke="#4a3010" stroke-width="2.5" stroke-dasharray="24 14"/>

  <!-- Dust trail (behind convoy) -->
  <ellipse cx="62"  cy="400" rx="70"  ry="25" fill="url(#dustCloud)" opacity="0.75"/>
  <ellipse cx="38"  cy="382" rx="48"  ry="18" fill="url(#dustCloud)" opacity="0.58"/>
  <ellipse cx="22"  cy="366" rx="32"  ry="12" fill="url(#dustCloud)" opacity="0.40"/>

  <!-- ═══ HEAVY TRANSPORT CONVOY ═══ -->
  <!-- Multi-axle low-loader trailer -->
  <rect x="78"  y="350" width="530" height="26" rx="3" fill="#1a2e4a"/>
  <!-- Trailer bed detail strip -->
  <rect x="78"  y="352" width="530" height="5" fill="#243e60"/>
  <!-- Trailer wheels (10 axles) -->
  <ellipse cx="115" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="115" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>
  <ellipse cx="158" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="158" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>
  <ellipse cx="248" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="248" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>
  <ellipse cx="291" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="291" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>
  <ellipse cx="390" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="390" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>
  <ellipse cx="433" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="433" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>
  <ellipse cx="530" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="530" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>
  <ellipse cx="573" cy="380" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="573" cy="380" rx="8"  ry="8"  fill="#1a2e4a"/>

  <!-- ═══ MINING EXCAVATOR ON TRAILER ═══ -->
  <!-- Undercarriage / crawler tracks -->
  <rect x="190" y="328" width="232" height="24" rx="7" fill="#283e20"/>
  <rect x="185" y="333" width="242" height="14" rx="5" fill="#1e3018"/>
  <!-- Track pad detail -->
  <line x1="202" y1="340" x2="414" y2="340" stroke="#283e20" stroke-width="3.5" stroke-dasharray="14 7"/>
  <!-- Upper body (main cab housing, yellow-amber) -->
  <rect x="202" y="285" width="208" height="45" rx="4" fill="#d0841a"/>
  <!-- Body detail lines -->
  <rect x="207" y="289" width="125" height="9" rx="2" fill="#b87010"/>
  <rect x="207" y="303" width="125" height="6" rx="2" fill="#b87010"/>
  <!-- Operator cab -->
  <rect x="340" y="268" width="72" height="63" rx="4" fill="#c07818"/>
  <!-- Cab windows (large) -->
  <rect x="348" y="275" width="30" height="22" rx="2" fill="#4a7aa8" fill-opacity="0.72"/>
  <rect x="384" y="275" width="20" height="22" rx="2" fill="#4a7aa8" fill-opacity="0.55"/>
  <!-- Window frame glint -->
  <line x1="348" y1="275" x2="348" y2="297" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
  <!-- Counterweight -->
  <rect x="412" y="282" width="22" height="34" rx="2" fill="#a06010"/>
  <!-- Boom arm (long, reaching forward) -->
  <line x1="250" y1="290" x2="162" y2="204" stroke="#c07818" stroke-width="13" stroke-linecap="round"/>
  <!-- Stick arm -->
  <line x1="162" y1="204" x2="130" y2="278" stroke="#b06a10" stroke-width="10" stroke-linecap="round"/>
  <!-- Hydraulic cylinders (on boom) -->
  <line x1="248" y1="291" x2="195" y2="240" stroke="#8a6020" stroke-width="4" stroke-opacity="0.8"/>
  <line x1="162" y1="205" x2="150" y2="250" stroke="#8a6020" stroke-width="3.5" stroke-opacity="0.8"/>
  <!-- Bucket (rock bucket, large teeth) -->
  <path d="M110 276 L152 280 L147 302 L106 298Z" fill="#9a5c0e"/>
  <!-- Bucket teeth -->
  <path d="M108 298 L113 308 L118 298" fill="#8a5010"/>
  <path d="M119 299 L124 309 L129 299" fill="#8a5010"/>
  <path d="M130 300 L135 310 L140 300" fill="#8a5010"/>
  <path d="M141 300 L146 309 L151 300" fill="#8a5010"/>

  <!-- Shadow of excavator on trailer (depth) -->
  <ellipse cx="310" cy="352" rx="120" ry="8" fill="#0a1018" fill-opacity="0.30"/>

  <!-- ═══ PRIME MOVER TRUCK CAB ═══ -->
  <rect x="560" y="324" width="92"  height="54" rx="5" fill="#0c2040"/>
  <rect x="600" y="310" width="56"  height="18" rx="3" fill="#0c2040"/>
  <!-- Windshield -->
  <rect x="568" y="330" width="56"  height="28" rx="2" fill="#2a4f7a" fill-opacity="0.70"/>
  <!-- Window glint -->
  <line x1="568" y1="330" x2="568" y2="358" stroke="#ffffff" stroke-width="1" stroke-opacity="0.30"/>
  <!-- Headlights -->
  <ellipse cx="648" cy="358" rx="6"  ry="6" fill="#ffee88" fill-opacity="0.95"/>
  <ellipse cx="648" cy="340" rx="5"  ry="4" fill="#ffee88" fill-opacity="0.65"/>
  <!-- Headlight glow -->
  <ellipse cx="662" cy="366" rx="18" ry="7" fill="#ffee88" fill-opacity="0.12"/>
  <!-- Truck wheels -->
  <ellipse cx="585" cy="382" rx="17" ry="17" fill="#080f1c"/>
  <ellipse cx="585" cy="382" rx="10" ry="10" fill="#1a2e4a"/>
  <ellipse cx="638" cy="382" rx="17" ry="17" fill="#080f1c"/>
  <ellipse cx="638" cy="382" rx="10" ry="10" fill="#1a2e4a"/>
  <!-- Safety flag on rear of trailer -->
  <line x1="78"  y1="350" x2="78"  y2="316" stroke="#d0d0d0" stroke-width="2.5"/>
  <rect x="78"  y="316" width="22"  height="14" fill="#f07b2b"/>
  <!-- Safety flag on truck -->
  <line x1="605" y1="322" x2="605" y2="288" stroke="#d0d0d0" stroke-width="2.5"/>
  <rect x="584" y="288" width="22"  height="14" fill="#f07b2b"/>

  <!-- ═══ PILOT VEHICLE (in front) ═══ -->
  <rect x="694" y="358" width="72"  height="26" rx="4" fill="#1a3050"/>
  <rect x="724" y="348" width="46"  height="14" rx="3" fill="#1a3050"/>
  <!-- Pilot wheels -->
  <ellipse cx="708" cy="388" rx="12" ry="12" fill="#080f1c"/>
  <ellipse cx="708" cy="388" rx="7"  ry="7"  fill="#1a2e4a"/>
  <ellipse cx="752" cy="388" rx="12" ry="12" fill="#080f1c"/>
  <ellipse cx="752" cy="388" rx="7"  ry="7"  fill="#1a2e4a"/>
  <!-- Pilot beacon (flashing orange) -->
  <ellipse cx="726" cy="348" rx="7"  ry="5" fill="#f07b2b" fill-opacity="0.95"/>
  <ellipse cx="726" cy="348" rx="12" ry="8" fill="#f07b2b" fill-opacity="0.20"/>
  <!-- Headlight -->
  <circle  cx="763" cy="368" r="5"  fill="#ffee88" fill-opacity="0.90"/>

  <!-- Orange accent line -->
  <rect x="0" y="445" width="800" height="5" fill="#f07b2b"/>

  <!-- Label -->
  <rect x="22" y="22" width="262" height="38" rx="6" fill="#000000" fill-opacity="0.45"/>
  <text x="34" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Mining Equipment Relocation</text>
</svg>
