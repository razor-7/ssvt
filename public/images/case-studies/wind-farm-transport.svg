<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2d5b"/>
      <stop offset="100%" stop-color="#1e4a8a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3d6e"/>
      <stop offset="100%" stop-color="#0d2d5b"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f07b2b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f07b2b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f07b2b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- Sunset glow -->
  <ellipse cx="400" cy="280" rx="300" ry="80" fill="url(#sunset)"/>
  <!-- Sea -->
  <rect x="0" y="300" width="800" height="150" fill="url(#sea)"/>
  <!-- Sea waves -->
  <path d="M0 310 Q100 305 200 312 Q300 318 400 312 Q500 305 600 312 Q700 318 800 312 L800 320 L0 320Z" fill="#ffffff" fill-opacity="0.05"/>
  <path d="M0 325 Q120 320 240 327 Q360 333 480 327 Q600 320 720 327 L800 330 L0 330Z" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Wind turbine 1 (large, centre) -->
  <line x1="400" y1="350" x2="400" y2="160" stroke="#e0e8f0" stroke-width="6"/>
  <ellipse cx="400" cy="160" rx="8" ry="8" fill="#e0e8f0"/>
  <!-- Blades -->
  <path d="M400 160 L380 80 L395 158Z" fill="#e0e8f0" fill-opacity="0.9"/>
  <path d="M400 160 L460 195 L402 165Z" fill="#c8d8ec" fill-opacity="0.9"/>
  <path d="M400 160 L340 195 L398 165Z" fill="#d4e0f0" fill-opacity="0.9"/>

  <!-- Wind turbine 2 (left) -->
  <line x1="200" y1="360" x2="200" y2="210" stroke="#c8d8ec" stroke-width="4"/>
  <ellipse cx="200" cy="210" rx="6" ry="6" fill="#c8d8ec"/>
  <path d="M200 210 L184 148 L197 208Z" fill="#c8d8ec" fill-opacity="0.8"/>
  <path d="M200 210 L248 237 L202 213Z" fill="#aac0d8" fill-opacity="0.8"/>
  <path d="M200 210 L152 237 L198 213Z" fill="#b8cce0" fill-opacity="0.8"/>

  <!-- Wind turbine 3 (right) -->
  <line x1="600" y1="360" x2="600" y2="210" stroke="#c8d8ec" stroke-width="4"/>
  <ellipse cx="600" cy="210" rx="6" ry="6" fill="#c8d8ec"/>
  <path d="M600 210 L584 148 L597 208Z" fill="#c8d8ec" fill-opacity="0.8"/>
  <path d="M600 210 L648 237 L602 213Z" fill="#aac0d8" fill-opacity="0.8"/>
  <path d="M600 210 L552 237 L598 213Z" fill="#b8cce0" fill-opacity="0.8"/>

  <!-- Wind turbine 4 (far left, small) -->
  <line x1="90" y1="370" x2="90" y2="260" stroke="#8aabcc" stroke-width="3"/>
  <path d="M90 260 L78 210 L88 258Z" fill="#8aabcc" fill-opacity="0.6"/>
  <path d="M90 260 L126 278 L91 262Z" fill="#7a9dbe" fill-opacity="0.6"/>
  <path d="M90 260 L54 278 L89 262Z" fill="#7a9dbe" fill-opacity="0.6"/>

  <!-- Wind turbine 5 (far right, small) -->
  <line x1="710" y1="370" x2="710" y2="260" stroke="#8aabcc" stroke-width="3"/>
  <path d="M710 260 L698 210 L708 258Z" fill="#8aabcc" fill-opacity="0.6"/>
  <path d="M710 260 L746 278 L711 262Z" fill="#7a9dbe" fill-opacity="0.6"/>
  <path d="M710 260 L674 278 L709 262Z" fill="#7a9dbe" fill-opacity="0.6"/>

  <!-- Ship silhouette -->
  <path d="M280 340 L520 340 L540 355 L260 355Z" fill="#0a2040"/>
  <rect x="330" y="310" width="140" height="30" fill="#0a2040"/>
  <rect x="355" y="290" width="30" height="22" fill="#112244"/>
  <rect x="410" y="295" width="25" height="17" fill="#112244"/>
  <!-- Ship windows -->
  <rect x="340" y="315" width="8" height="6" rx="1" fill="#f07b2b" fill-opacity="0.7"/>
  <rect x="356" y="315" width="8" height="6" rx="1" fill="#f07b2b" fill-opacity="0.7"/>
  <rect x="372" y="315" width="8" height="6" rx="1" fill="#f07b2b" fill-opacity="0.7"/>

  <!-- Orange accent line at bottom -->
  <rect x="0" y="445" width="800" height="5" fill="#f07b2b"/>

  <!-- Label -->
  <rect x="24" y="24" width="260" height="40" rx="6" fill="#000000" fill-opacity="0.35"/>
  <text x="36" y="49" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Offshore Wind Farm Transport</text>
</svg>
