<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Rich sky: indigo → steel blue → golden horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#080f20"/>
      <stop offset="22%"  stop-color="#0d1a35"/>
      <stop offset="45%"  stop-color="#112240"/>
      <stop offset="62%"  stop-color="#1a3258"/>
      <stop offset="76%"  stop-color="#2a3060"/>
      <stop offset="87%"  stop-color="#5a3010"/>
      <stop offset="94%"  stop-color="#9a5018"/>
      <stop offset="100%" stop-color="#c87020"/>
    </linearGradient>
    <!-- Sun glow at horizon -->
    <radialGradient id="sunGlow" cx="68%" cy="68%" r="32%">
      <stop offset="0%"   stop-color="#ffa040" stop-opacity="0.9"/>
      <stop offset="18%"  stop-color="#e87020" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#9a4010" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#9a4010" stop-opacity="0"/>
    </radialGradient>
    <!-- Deep ocean -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e1e38"/>
      <stop offset="40%"  stop-color="#09152a"/>
      <stop offset="100%" stop-color="#040c1a"/>
    </linearGradient>
    <!-- Water orange reflection -->
    <radialGradient id="seaGlow" cx="68%" cy="0%" r="55%">
      <stop offset="0%"   stop-color="#e87020" stop-opacity="0.35"/>
      <stop offset="35%"  stop-color="#9a4010" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9a4010" stop-opacity="0"/>
    </radialGradient>
    <!-- Cloud (far, cool) -->
    <linearGradient id="cloudCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1a30" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3a1800" stop-opacity="0.50"/>
    </linearGradient>
    <!-- Cloud (warm, near horizon) -->
    <linearGradient id="cloudWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#142035" stop-opacity="0.82"/>
      <stop offset="55%"  stop-color="#2e1400" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7a3800" stop-opacity="0.68"/>
    </linearGradient>
    <!-- Horizon warmth -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c87020" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#9a4010" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9a4010" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect width="800" height="450" fill="url(#sunGlow)"/>

  <!-- Far clouds (high, cool) -->
  <ellipse cx="60"  cy="62"  rx="80"  ry="18" fill="url(#cloudCool)" opacity="0.55"/>
  <ellipse cx="125" cy="50"  rx="60"  ry="15" fill="url(#cloudCool)" opacity="0.60"/>
  <ellipse cx="360" cy="48"  rx="100" ry="22" fill="url(#cloudCool)" opacity="0.52"/>
  <ellipse cx="440" cy="36"  rx="75"  ry="18" fill="url(#cloudCool)" opacity="0.57"/>
  <ellipse cx="680" cy="55"  rx="90"  ry="20" fill="url(#cloudCool)" opacity="0.53"/>
  <ellipse cx="760" cy="42"  rx="65"  ry="16" fill="url(#cloudCool)" opacity="0.58"/>

  <!-- Mid clouds (warmer) -->
  <ellipse cx="140" cy="110" rx="120" ry="30" fill="url(#cloudWarm)" opacity="0.62"/>
  <ellipse cx="230" cy="96"  rx="90"  ry="24" fill="url(#cloudWarm)" opacity="0.67"/>
  <ellipse cx="75"  cy="120" rx="65"  ry="18" fill="url(#cloudWarm)" opacity="0.50"/>
  <ellipse cx="570" cy="100" rx="130" ry="32" fill="url(#cloudWarm)" opacity="0.60"/>
  <ellipse cx="665" cy="86"  rx="100" ry="26" fill="url(#cloudWarm)" opacity="0.65"/>

  <!-- Low near-horizon clouds (most golden) -->
  <ellipse cx="300" cy="175" rx="160" ry="42" fill="url(#cloudWarm)" opacity="0.65"/>
  <ellipse cx="420" cy="158" rx="130" ry="36" fill="url(#cloudWarm)" opacity="0.70"/>
  <ellipse cx="190" cy="185" rx="95"  ry="28" fill="url(#cloudWarm)" opacity="0.52"/>
  <ellipse cx="680" cy="165" rx="145" ry="40" fill="url(#cloudWarm)" opacity="0.62"/>
  <ellipse cx="775" cy="148" rx="100" ry="30" fill="url(#cloudWarm)" opacity="0.57"/>

  <!-- Horizon haze -->
  <rect x="0" y="248" width="800" height="60" fill="url(#haze)"/>

  <!-- Ocean -->
  <rect x="0" y="293" width="800" height="157" fill="url(#sea)"/>
  <rect x="0" y="293" width="800" height="157" fill="url(#seaGlow)"/>
  <!-- Wave lines -->
  <path d="M0 308 Q100 304 200 310 Q300 315 400 310 Q500 304 600 310 Q700 315 800 310" fill="none" stroke="#e87020" stroke-width="1" stroke-opacity="0.09"/>
  <path d="M0 322 Q120 318 240 324 Q360 329 480 324 Q600 318 720 324 L800 324" fill="none" stroke="#e87020" stroke-width="0.8" stroke-opacity="0.06"/>
  <path d="M0 338 Q100 335 200 340 Q300 344 400 340 Q500 335 600 340 Q700 344 800 340" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.035"/>
  <path d="M0 358 Q120 355 240 360 Q360 364 480 360 Q600 355 720 360 L800 360" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.025"/>
  <path d="M0 385 Q100 383 200 387 Q300 390 400 387 Q500 383 600 387 Q700 390 800 387" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.02"/>

  <!-- ═══ WIND TURBINES ═══ -->
  <!-- Turbine 1 — largest (centre) -->
  <line x1="395" y1="350" x2="395" y2="145" stroke="#d8e4f0" stroke-width="6"/>
  <ellipse cx="395" cy="145" rx="7" ry="7" fill="#d8e4f0"/>
  <!-- Blades 1 -->
  <path d="M395 145 L372 58  L392 143Z" fill="#d8e4f0" fill-opacity="0.92"/>
  <path d="M395 145 L462 190 L397 149Z" fill="#c4d4e8" fill-opacity="0.88"/>
  <path d="M395 145 L328 190 L393 149Z" fill="#ccdcf0" fill-opacity="0.90"/>
  <!-- Turbine 2 — left -->
  <line x1="195" y1="360" x2="195" y2="200" stroke="#bccce0" stroke-width="4"/>
  <ellipse cx="195" cy="200" rx="5" ry="5" fill="#bccce0"/>
  <path d="M195 200 L178 132 L193 198Z" fill="#bccce0" fill-opacity="0.82"/>
  <path d="M195 200 L246 228 L197 203Z" fill="#a8bcdc" fill-opacity="0.80"/>
  <path d="M195 200 L144 228 L193 203Z" fill="#b4c8e0" fill-opacity="0.82"/>
  <!-- Turbine 3 — right -->
  <line x1="600" y1="360" x2="600" y2="200" stroke="#bccce0" stroke-width="4"/>
  <ellipse cx="600" cy="200" rx="5" ry="5" fill="#bccce0"/>
  <path d="M600 200 L583 132 L598 198Z" fill="#bccce0" fill-opacity="0.82"/>
  <path d="M600 200 L651 228 L602 203Z" fill="#a8bcdc" fill-opacity="0.80"/>
  <path d="M600 200 L549 228 L598 203Z" fill="#b4c8e0" fill-opacity="0.82"/>
  <!-- Turbine 4 — far left (distant, hazy) -->
  <line x1="72"  y1="370" x2="72"  y2="252" stroke="#7a9ab8" stroke-width="3" stroke-opacity="0.7"/>
  <path d="M72  252 L59  196 L70  250Z" fill="#7a9ab8" fill-opacity="0.55"/>
  <path d="M72  252 L110 272 L73  254Z" fill="#6a8aac" fill-opacity="0.55"/>
  <path d="M72  252 L34  272 L71  254Z" fill="#6a8aac" fill-opacity="0.55"/>
  <!-- Turbine 5 — far right (distant, hazy) -->
  <line x1="728" y1="370" x2="728" y2="252" stroke="#7a9ab8" stroke-width="3" stroke-opacity="0.7"/>
  <path d="M728 252 L715 196 L726 250Z" fill="#7a9ab8" fill-opacity="0.55"/>
  <path d="M728 252 L766 272 L729 254Z" fill="#6a8aac" fill-opacity="0.55"/>
  <path d="M728 252 L690 272 L727 254Z" fill="#6a8aac" fill-opacity="0.55"/>
  <!-- Turbine 6 — very distant, barely visible -->
  <line x1="480" y1="370" x2="480" y2="278" stroke="#5a7a9a" stroke-width="2" stroke-opacity="0.45"/>
  <path d="M480 278 L471 234 L478 276Z" fill="#5a7a9a" fill-opacity="0.38"/>
  <path d="M480 278 L506 292 L481 280Z" fill="#5a7a9a" fill-opacity="0.38"/>
  <path d="M480 278 L454 292 L479 280Z" fill="#5a7a9a" fill-opacity="0.38"/>

  <!-- ═══ INSTALLATION VESSEL ═══ -->
  <!-- Hull -->
  <path d="M245 330 L555 330 L575 345 L225 345Z" fill="#06101e"/>
  <!-- Deck -->
  <rect x="268" y="306" width="260" height="26" fill="#07121e"/>
  <!-- Bridge/superstructure -->
  <rect x="488" y="275" width="50" height="56" rx="2" fill="#07121e"/>
  <!-- Bridge windows (lit) -->
  <rect x="494" y="281" width="14" height="9"  rx="1" fill="#f07b2b" fill-opacity="0.28"/>
  <rect x="514" y="281" width="14" height="9"  rx="1" fill="#f07b2b" fill-opacity="0.22"/>
  <!-- Crane on deck -->
  <line x1="310" y1="306" x2="310" y2="255" stroke="#0a1628" stroke-width="6"/>
  <line x1="310" y1="262" x2="370" y2="280" stroke="#0a1628" stroke-width="4"/>
  <line x1="310" y1="262" x2="272" y2="272" stroke="#0a1628" stroke-width="3"/>
  <!-- Cable + load -->
  <line x1="350" y1="274" x2="350" y2="306" stroke="#0a1628" stroke-width="1.5"/>
  <!-- Ship funnel smoke -->
  <ellipse cx="510" cy="268" rx="8"  ry="5"  fill="#1a2434" fill-opacity="0.5"/>
  <ellipse cx="513" cy="258" rx="10" ry="6"  fill="#1a2434" fill-opacity="0.40"/>
  <ellipse cx="516" cy="246" rx="13" ry="7"  fill="#1a2434" fill-opacity="0.30"/>
  <!-- Deck detail / rigging lines -->
  <line x1="268" y1="306" x2="528" y2="306" stroke="#0d1a2e" stroke-width="1.5"/>

  <!-- Ship water reflection (subtle) -->
  <ellipse cx="395" cy="350" rx="180" ry="12" fill="#e87020" fill-opacity="0.055"/>

  <!-- Orange accent line -->
  <rect x="0" y="445" width="800" height="5" fill="#f07b2b"/>

  <!-- Label chip -->
  <rect x="22" y="22" width="252" height="38" rx="6" fill="#000000" fill-opacity="0.45"/>
  <text x="34" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Offshore Wind Farm Transport</text>
</svg>
