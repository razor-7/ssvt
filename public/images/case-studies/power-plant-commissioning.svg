<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2840"/>
      <stop offset="100%" stop-color="#0d1a2a"/>
    </linearGradient>
    <radialGradient id="turbineglow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#f07b2b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f07b2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Ground level -->
  <rect x="0" y="390" width="800" height="60" fill="url(#ground)"/>

  <!-- Large turbine building (main) -->
  <rect x="200" y="200" width="350" height="190" rx="4" fill="#1a2e4a"/>
  <rect x="200" y="195" width="350" height="14" rx="2" fill="#2a4060"/>
  <!-- Building grid lines -->
  <line x1="275" y1="200" x2="275" y2="390" stroke="#0d1f35" stroke-width="1.5"/>
  <line x1="350" y1="200" x2="350" y2="390" stroke="#0d1f35" stroke-width="1.5"/>
  <line x1="425" y1="200" x2="425" y2="390" stroke="#0d1f35" stroke-width="1.5"/>
  <line x1="200" y1="260" x2="550" y2="260" stroke="#0d1f35" stroke-width="1.5"/>
  <line x1="200" y1="320" x2="550" y2="320" stroke="#0d1f35" stroke-width="1.5"/>
  <!-- Windows/panels -->
  <rect x="212" y="212" width="50" height="35" rx="2" fill="#2a5080" fill-opacity="0.5"/>
  <rect x="278" y="212" width="50" height="35" rx="2" fill="#2a5080" fill-opacity="0.5"/>
  <rect x="362" y="212" width="50" height="35" rx="2" fill="#2a5080" fill-opacity="0.5"/>
  <rect x="437" y="212" width="50" height="35" rx="2" fill="#2a5080" fill-opacity="0.5"/>
  <rect x="212" y="272" width="50" height="35" rx="2" fill="#f07b2b" fill-opacity="0.15"/>
  <rect x="278" y="272" width="50" height="35" rx="2" fill="#f07b2b" fill-opacity="0.2"/>
  <rect x="362" y="272" width="50" height="35" rx="2" fill="#f07b2b" fill-opacity="0.15"/>
  <rect x="437" y="272" width="50" height="35" rx="2" fill="#2a5080" fill-opacity="0.4"/>

  <!-- Gas turbine on ground level (large cylindrical form) -->
  <!-- Turbine casing -->
  <ellipse cx="375" cy="360" rx="90" ry="24" fill="#0f2035"/>
  <rect x="285" y="336" width="180" height="28" fill="#152840"/>
  <ellipse cx="285" cy="350" rx="20" ry="28" fill="#0f2035"/>
  <ellipse cx="465" cy="350" rx="20" ry="28" fill="#152840"/>
  <!-- Turbine detail bands -->
  <line x1="310" y1="334" x2="310" y2="376" stroke="#1e3a5a" stroke-width="2"/>
  <line x1="340" y1="334" x2="340" y2="376" stroke="#1e3a5a" stroke-width="2"/>
  <line x1="370" y1="334" x2="370" y2="376" stroke="#1e3a5a" stroke-width="2"/>
  <line x1="400" y1="334" x2="400" y2="376" stroke="#1e3a5a" stroke-width="2"/>
  <line x1="430" y1="334" x2="430" y2="376" stroke="#1e3a5a" stroke-width="2"/>
  <!-- Inlet cone -->
  <path d="M265 335 L285 322 L285 378 L265 365Z" fill="#1a3050"/>
  <!-- Exhaust -->
  <path d="M465 325 L510 310 L510 390 L465 375Z" fill="#152840"/>
  <ellipse cx="510" cy="350" rx="15" ry="40" fill="#0f2035"/>
  <!-- Heat haze from exhaust -->
  <ellipse cx="510" cy="305" rx="20" ry="10" fill="#f07b2b" fill-opacity="0.15"/>
  <ellipse cx="515" cy="290" rx="25" ry="12" fill="#f07b2b" fill-opacity="0.1"/>

  <!-- Cooling tower (right) -->
  <path d="M620 180 Q640 250 620 390 L700 390 Q680 250 700 180Z" fill="#1e3558"/>
  <ellipse cx="660" cy="180" rx="40" ry="10" fill="#243e65"/>
  <!-- Steam from cooling tower -->
  <ellipse cx="660" cy="165" rx="25" ry="12" fill="#334466" fill-opacity="0.5"/>
  <ellipse cx="665" cy="148" rx="30" ry="14" fill="#334466" fill-opacity="0.4"/>
  <ellipse cx="658" cy="130" rx="35" ry="15" fill="#334466" fill-opacity="0.3"/>

  <!-- Cooling tower (left, partial) -->
  <path d="M30 200 Q50 270 30 390 L110 390 Q90 270 110 200Z" fill="#1e3558"/>
  <ellipse cx="70" cy="200" rx="40" ry="10" fill="#243e65"/>
  <ellipse cx="70" cy="185" rx="22" ry="10" fill="#334466" fill-opacity="0.4"/>
  <ellipse cx="75" cy="170" rx="28" ry="12" fill="#334466" fill-opacity="0.3"/>

  <!-- Transformer yard (foreground) -->
  <rect x="550" y="340" width="30" height="50" rx="2" fill="#1a3050"/>
  <rect x="590" y="345" width="22" height="45" rx="2" fill="#1a3050"/>
  <!-- Transformer detail -->
  <rect x="553" y="345" width="24" height="8" fill="#2a4060"/>
  <rect x="553" y="358" width="24" height="8" fill="#2a4060"/>
  <rect x="553" y="371" width="24" height="8" fill="#2a4060"/>
  <!-- Transmission tower -->
  <line x1="740" y1="180" x2="740" y2="390" stroke="#2a4060" stroke-width="3"/>
  <line x1="720" y1="220" x2="760" y2="220" stroke="#2a4060" stroke-width="3"/>
  <line x1="715" y1="250" x2="765" y2="250" stroke="#2a4060" stroke-width="3"/>
  <line x1="730" y1="190" x2="740" y2="220" stroke="#2a4060" stroke-width="2"/>
  <line x1="750" y1="190" x2="740" y2="220" stroke="#2a4060" stroke-width="2"/>
  <!-- Insulators/wires -->
  <line x1="760" y1="220" x2="800" y2="215" stroke="#2a4060" stroke-width="1.5"/>
  <line x1="765" y1="250" x2="800" y2="248" stroke="#2a4060" stroke-width="1.5"/>

  <!-- Heavy lift crane -->
  <!-- Crane base/body -->
  <rect x="130" y="280" width="40" height="110" rx="3" fill="#0d2240"/>
  <!-- Crane cab -->
  <rect x="125" y="258" width="50" height="30" rx="3" fill="#0d2240"/>
  <rect x="132" y="263" width="24" height="16" rx="2" fill="#2a4f7a" fill-opacity="0.6"/>
  <!-- Crane boom -->
  <line x1="150" y1="260" x2="200" y2="120" stroke="#1e3a5a" stroke-width="8" stroke-linecap="round"/>
  <!-- Jib -->
  <line x1="200" y1="120" x2="160" y2="90" stroke="#1e3a5a" stroke-width="4" stroke-linecap="round"/>
  <!-- Hook line -->
  <line x1="200" y1="120" x2="200" y2="200" stroke="#334466" stroke-width="2"/>
  <!-- Lifted component (turbine part) -->
  <ellipse cx="200" cy="215" rx="30" ry="12" fill="#c07818"/>
  <rect x="170" y="203" width="60" height="28" rx="4" fill="#d4861a"/>
  <ellipse cx="200" cy="231" rx="30" ry="12" fill="#bf7a14"/>
  <!-- Hook -->
  <path d="M197 200 Q195 208 200 210 Q205 208 203 200" fill="none" stroke="#334466" stroke-width="2"/>
  <!-- Crane tracks/wheels -->
  <ellipse cx="135" cy="394" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="135" cy="394" rx="8" ry="8" fill="#1a2e4a"/>
  <ellipse cx="165" cy="394" rx="14" ry="14" fill="#0a1628"/>
  <ellipse cx="165" cy="394" rx="8" ry="8" fill="#1a2e4a"/>

  <!-- Glow from turbine -->
  <rect x="200" y="300" width="350" height="90" fill="url(#turbineglow)"/>

  <!-- Light beams from work lights -->
  <line x1="200" y1="195" x2="150" y2="240" stroke="#ffee88" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="550" y1="195" x2="600" y2="240" stroke="#ffee88" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Work lights on building -->
  <ellipse cx="205" cy="197" rx="5" ry="5" fill="#ffee88" fill-opacity="0.8"/>
  <ellipse cx="545" cy="197" rx="5" ry="5" fill="#ffee88" fill-opacity="0.8"/>
  <ellipse cx="375" cy="197" rx="5" ry="5" fill="#ffee88" fill-opacity="0.6"/>

  <!-- Orange accent line -->
  <rect x="0" y="445" width="800" height="5" fill="#f07b2b"/>

  <!-- Label -->
  <rect x="24" y="24" width="295" height="40" rx="6" fill="#000000" fill-opacity="0.4"/>
  <text x="36" y="49" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Power Plant Commissioning</text>
</svg>
