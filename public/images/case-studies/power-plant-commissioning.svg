<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Deep blue-black night sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#02040c"/>
      <stop offset="25%"  stop-color="#050a18"/>
      <stop offset="50%"  stop-color="#081020"/>
      <stop offset="72%"  stop-color="#0c1830"/>
      <stop offset="90%"  stop-color="#101e38"/>
      <stop offset="100%" stop-color="#121e38"/>
    </linearGradient>
    <!-- Warm ambient glow from turbine hall work lights -->
    <radialGradient id="warmGlow" cx="42%" cy="88%" r="50%">
      <stop offset="0%"   stop-color="#f07b2b" stop-opacity="0.45"/>
      <stop offset="25%"  stop-color="#c05010" stop-opacity="0.24"/>
      <stop offset="60%"  stop-color="#7a2e00" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#7a2e00" stop-opacity="0"/>
    </radialGradient>
    <!-- Secondary glow from cooling tower area -->
    <radialGradient id="coolGlow" cx="82%" cy="55%" r="35%">
      <stop offset="0%"   stop-color="#e0f0ff" stop-opacity="0.18"/>
      <stop offset="40%"  stop-color="#8ab8e0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8ab8e0" stop-opacity="0"/>
    </radialGradient>
    <!-- Ground (dark, with faint warm cast) -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e1a2c"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <!-- Turbine hall building face (illuminated) -->
    <linearGradient id="hallFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a2e4a"/>
      <stop offset="100%" stop-color="#0f2038"/>
    </linearGradient>
    <!-- Steam / cloud from cooling towers -->
    <radialGradient id="steam" cx="50%" cy="80%" r="50%">
      <stop offset="0%"   stop-color="#b0c8e0" stop-opacity="0.60"/>
      <stop offset="40%"  stop-color="#7a9ab8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7a9ab8" stop-opacity="0"/>
    </radialGradient>
    <!-- Smoke plume from exhaust -->
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#182030" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#182030" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="28"  cy="18"  r="0.9" fill="#ffffff" fill-opacity="0.78"/>
  <circle cx="72"  cy="8"   r="1.1" fill="#ffffff" fill-opacity="0.82"/>
  <circle cx="128" cy="25"  r="0.8" fill="#ffffff" fill-opacity="0.70"/>
  <circle cx="188" cy="11"  r="1.0" fill="#ffffff" fill-opacity="0.76"/>
  <circle cx="250" cy="30"  r="0.9" fill="#ffffff" fill-opacity="0.73"/>
  <circle cx="315" cy="6"   r="1.2" fill="#ffffff" fill-opacity="0.84"/>
  <circle cx="375" cy="20"  r="0.8" fill="#ffffff" fill-opacity="0.68"/>
  <circle cx="440" cy="14"  r="1.0" fill="#ffffff" fill-opacity="0.76"/>
  <circle cx="502" cy="28"  r="0.9" fill="#ffffff" fill-opacity="0.72"/>
  <circle cx="568" cy="9"   r="1.1" fill="#ffffff" fill-opacity="0.80"/>
  <circle cx="632" cy="24"  r="0.8" fill="#ffffff" fill-opacity="0.68"/>
  <circle cx="694" cy="10"  r="1.0" fill="#ffffff" fill-opacity="0.78"/>
  <circle cx="752" cy="28"  r="0.9" fill="#ffffff" fill-opacity="0.73"/>
  <circle cx="790" cy="14"  r="0.8" fill="#ffffff" fill-opacity="0.70"/>
  <circle cx="48"  cy="58"  r="0.8" fill="#ffffff" fill-opacity="0.65"/>
  <circle cx="105" cy="68"  r="1.0" fill="#ffffff" fill-opacity="0.70"/>
  <circle cx="174" cy="52"  r="0.8" fill="#ffffff" fill-opacity="0.63"/>
  <circle cx="238" cy="72"  r="0.9" fill="#ffffff" fill-opacity="0.68"/>
  <circle cx="356" cy="44"  r="0.8" fill="#ffffff" fill-opacity="0.64"/>
  <circle cx="462" cy="60"  r="1.0" fill="#ffffff" fill-opacity="0.70"/>
  <circle cx="546" cy="40"  r="0.8" fill="#ffffff" fill-opacity="0.65"/>
  <circle cx="628" cy="68"  r="0.9" fill="#ffffff" fill-opacity="0.68"/>
  <circle cx="758" cy="48"  r="0.8" fill="#ffffff" fill-opacity="0.63"/>
  <!-- Faint Milky Way band (very subtle) -->
  <ellipse cx="400" cy="60" rx="380" ry="22" fill="#1a2840" fill-opacity="0.18"/>

  <!-- Warm glow from plant below -->
  <rect width="800" height="450" fill="url(#warmGlow)"/>
  <!-- Cool glow from cooling towers -->
  <rect width="800" height="450" fill="url(#coolGlow)"/>

  <!-- Ground -->
  <rect x="0" y="390" width="800" height="60" fill="url(#ground)"/>
  <!-- Ground ambient light reflection -->
  <rect x="0" y="386" width="800" height="8" fill="#f07b2b" fill-opacity="0.07"/>

  <!-- ═══ COOLING TOWERS (right) ═══ -->
  <!-- Cooling tower 1 (main, right-centre) -->
  <path d="M615 172 Q638 255 615 392 L702 392 Q680 255 702 172Z" fill="#162840"/>
  <ellipse cx="658" cy="172" rx="44" ry="11" fill="#1e3458"/>
  <!-- Steam cloud from cooling tower 1 -->
  <ellipse cx="658" cy="156" rx="28"  ry="15" fill="url(#steam)" opacity="0.70"/>
  <ellipse cx="654" cy="138" rx="36"  ry="18" fill="url(#steam)" opacity="0.58"/>
  <ellipse cx="660" cy="118" rx="45"  ry="22" fill="url(#steam)" opacity="0.47"/>
  <ellipse cx="652" cy="96"  rx="55"  ry="26" fill="url(#steam)" opacity="0.36"/>
  <ellipse cx="658" cy="74"  rx="64"  ry="28" fill="url(#steam)" opacity="0.26"/>
  <ellipse cx="650" cy="52"  rx="72"  ry="30" fill="url(#steam)" opacity="0.18"/>
  <!-- Cooling tower interior dark -->
  <ellipse cx="658" cy="178" rx="32"  ry="8"  fill="#0e1e30" fill-opacity="0.80"/>
  <!-- Tower surface detail (horizontal ribs) -->
  <path d="M620 230 Q638 227 658 228 Q678 229 698 226" fill="none" stroke="#1e3458" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M617 270 Q638 267 658 268 Q678 269 700 266" fill="none" stroke="#1e3458" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M615 310 Q638 307 658 308 Q678 309 702 306" fill="none" stroke="#1e3458" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M615 350 Q638 347 658 348 Q678 349 702 346" fill="none" stroke="#1e3458" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Cooling tower 2 (left, partial) -->
  <path d="M26 192 Q46 272 26 392 L106 392 Q86 272 106 192Z" fill="#162840"/>
  <ellipse cx="66"  cy="192" rx="40"  ry="10" fill="#1e3458"/>
  <!-- Steam from tower 2 -->
  <ellipse cx="66"  cy="178" rx="24"  ry="13" fill="url(#steam)" opacity="0.62"/>
  <ellipse cx="62"  cy="160" rx="32"  ry="16" fill="url(#steam)" opacity="0.50"/>
  <ellipse cx="67"  cy="140" rx="40"  ry="20" fill="url(#steam)" opacity="0.40"/>
  <ellipse cx="62"  cy="118" rx="50"  ry="23" fill="url(#steam)" opacity="0.30"/>
  <ellipse cx="66"  cy="96"  rx="58"  ry="26" fill="url(#steam)" opacity="0.20"/>

  <!-- ═══ TURBINE HALL (main building, centre) ═══ -->
  <!-- Main hall body -->
  <rect x="190" y="194" width="370" height="196" rx="4" fill="url(#hallFace)"/>
  <!-- Roof edge detail -->
  <rect x="188" y="188" width="374" height="12" rx="2" fill="#243e6a"/>
  <!-- Building facade panels / grid -->
  <line x1="272" y1="194" x2="272" y2="390" stroke="#0c1e34" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="356" y1="194" x2="356" y2="390" stroke="#0c1e34" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="440" y1="194" x2="440" y2="390" stroke="#0c1e34" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="190" y1="262" x2="560" y2="262" stroke="#0c1e34" stroke-width="1.5" stroke-opacity="0.80"/>
  <line x1="190" y1="326" x2="560" y2="326" stroke="#0c1e34" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Illuminated windows (upper row — blue-white work light) -->
  <rect x="202" y="205" width="56"  height="38" rx="2" fill="#2a5088" fill-opacity="0.55"/>
  <rect x="280" y="205" width="56"  height="38" rx="2" fill="#2a5088" fill-opacity="0.48"/>
  <rect x="364" y="205" width="56"  height="38" rx="2" fill="#2a5088" fill-opacity="0.52"/>
  <rect x="448" y="205" width="56"  height="38" rx="2" fill="#2a5088" fill-opacity="0.44"/>
  <!-- Window frames -->
  <rect x="202" y="205" width="56"  height="38" rx="2" fill="none" stroke="#4a70a8" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="280" y="205" width="56"  height="38" rx="2" fill="none" stroke="#4a70a8" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="364" y="205" width="56"  height="38" rx="2" fill="none" stroke="#4a70a8" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="448" y="205" width="56"  height="38" rx="2" fill="none" stroke="#4a70a8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Illuminated windows (lower row — warm orange work light) -->
  <rect x="202" y="274" width="56"  height="38" rx="2" fill="#f07b2b" fill-opacity="0.22"/>
  <rect x="280" y="274" width="56"  height="38" rx="2" fill="#f07b2b" fill-opacity="0.28"/>
  <rect x="364" y="274" width="56"  height="38" rx="2" fill="#f07b2b" fill-opacity="0.20"/>
  <rect x="448" y="274" width="56"  height="38" rx="2" fill="#2a5088" fill-opacity="0.38"/>

  <!-- Work lights on roof (bright points) -->
  <circle cx="196" cy="193" r="4"  fill="#ffee88" fill-opacity="0.90"/>
  <ellipse cx="196" cy="196" rx="10" ry="6" fill="#ffee88" fill-opacity="0.14"/>
  <circle cx="374" cy="193" r="3.5" fill="#ffee88" fill-opacity="0.85"/>
  <circle cx="556" cy="193" r="4"  fill="#ffee88" fill-opacity="0.88"/>
  <ellipse cx="556" cy="196" rx="10" ry="6" fill="#ffee88" fill-opacity="0.14"/>

  <!-- ═══ GAS TURBINE ON GROUND LEVEL ═══ -->
  <!-- Turbine casing (large cylindrical form, in front of hall) -->
  <ellipse cx="375" cy="364" rx="94"  ry="26" fill="#0c1e34"/>
  <rect x="281" y="338" width="188" height="30" fill="#122030"/>
  <ellipse cx="281" cy="353" rx="22"  ry="30" fill="#0c1e34"/>
  <ellipse cx="469" cy="353" rx="22"  ry="30" fill="#122030"/>
  <!-- Turbine section bands (detail) -->
  <line x1="312" y1="336" x2="312" y2="378" stroke="#1e3450" stroke-width="2.5"/>
  <line x1="345" y1="336" x2="345" y2="378" stroke="#1e3450" stroke-width="2.5"/>
  <line x1="378" y1="336" x2="378" y2="378" stroke="#1e3450" stroke-width="2.5"/>
  <line x1="411" y1="336" x2="411" y2="378" stroke="#1e3450" stroke-width="2.5"/>
  <line x1="444" y1="336" x2="444" y2="378" stroke="#1e3450" stroke-width="2.5"/>
  <!-- Inlet bellmouth (left) -->
  <path d="M260 335 L281 318 L281 382 L260 365Z" fill="#162840"/>
  <!-- Exhaust diffuser (right) -->
  <path d="M469 325 L520 308 L520 396 L469 374Z" fill="#122030"/>
  <ellipse cx="520" cy="352" rx="16"  ry="44" fill="#0c1e34"/>
  <!-- Exhaust heat shimmer (gentle glow) -->
  <ellipse cx="520" cy="302" rx="22"  ry="12" fill="#f07b2b" fill-opacity="0.18"/>
  <ellipse cx="524" cy="286" rx="28"  ry="14" fill="#f07b2b" fill-opacity="0.12"/>
  <ellipse cx="520" cy="270" rx="34"  ry="15" fill="#f07b2b" fill-opacity="0.07"/>

  <!-- Glow pool under turbine (warm) -->
  <ellipse cx="375" cy="388" rx="120" ry="18" fill="#f07b2b" fill-opacity="0.10"/>

  <!-- ═══ HEAVY LIFT CRANE ═══ -->
  <!-- Crane base / body -->
  <rect x="128" y="278" width="44"  height="112" rx="3" fill="#0c1e34"/>
  <!-- Cab -->
  <rect x="122" y="256" width="54"  height="30"  rx="3" fill="#0c1e34"/>
  <rect x="130" y="262" width="26"  height="16"  rx="2" fill="#2a507a" fill-opacity="0.65"/>
  <!-- Boom -->
  <line x1="150" y1="258" x2="210" y2="112" stroke="#1a3050" stroke-width="9" stroke-linecap="round"/>
  <!-- Jib (secondary) -->
  <line x1="210" y1="112" x2="168" y2="78"  stroke="#1a3050" stroke-width="5" stroke-linecap="round"/>
  <!-- Boom stay -->
  <line x1="144" y1="256" x2="210" y2="112" stroke="#243e60" stroke-width="3"/>
  <!-- Hoist rope -->
  <line x1="210" y1="112" x2="210" y2="200" stroke="#2a4060" stroke-width="2.5"/>
  <!-- Lifted turbine component (turbine rotor section) -->
  <ellipse cx="210" cy="214" rx="32"  ry="13" fill="#c07818"/>
  <rect x="178" y="200" width="64"   height="30"  rx="4" fill="#d08420"/>
  <ellipse cx="210" cy="230" rx="32"  ry="13" fill="#b87010"/>
  <!-- Component lift glow -->
  <ellipse cx="210" cy="215" rx="40"  ry="16" fill="#f07b2b" fill-opacity="0.10"/>
  <!-- Crane tracks -->
  <rect x="110" y="388" width="66"   height="8"   rx="2" fill="#0c1e34"/>
  <ellipse cx="122" cy="392" rx="12"  ry="12" fill="#060e1c"/>
  <ellipse cx="122" cy="392" rx="7"   ry="7"  fill="#0c1e34"/>
  <ellipse cx="164" cy="392" rx="12"  ry="12" fill="#060e1c"/>
  <ellipse cx="164" cy="392" rx="7"   ry="7"  fill="#0c1e34"/>

  <!-- ═══ TRANSFORMER YARD (right foreground) ═══ -->
  <rect x="544" y="336" width="32"  height="54"  rx="2" fill="#162840"/>
  <rect x="548" y="340" width="24"  height="7"   fill="#243e5c"/>
  <rect x="548" y="353" width="24"  height="7"   fill="#243e5c"/>
  <rect x="548" y="366" width="24"  height="7"   fill="#243e5c"/>
  <rect x="584" y="342" width="24"  height="48"  rx="2" fill="#162840"/>
  <rect x="588" y="346" width="16"  height="6"   fill="#243e5c"/>
  <rect x="588" y="358" width="16"  height="6"   fill="#243e5c"/>
  <rect x="588" y="370" width="16"  height="6"   fill="#243e5c"/>

  <!-- Transmission tower (far right) -->
  <line x1="748" y1="168" x2="748" y2="392" stroke="#243e5c" stroke-width="3.5"/>
  <line x1="726" y1="212" x2="770" y2="212" stroke="#243e5c" stroke-width="3.5"/>
  <line x1="720" y1="244" x2="776" y2="244" stroke="#243e5c" stroke-width="3.5"/>
  <line x1="732" y1="178" x2="748" y2="212" stroke="#243e5c" stroke-width="2"/>
  <line x1="764" y1="178" x2="748" y2="212" stroke="#243e5c" stroke-width="2"/>
  <!-- Transmission lines -->
  <path d="M726 212 Q700 218 680 216 Q650 213 620 215" fill="none" stroke="#1e3458" stroke-width="1.5"/>
  <path d="M720 244 Q695 249 660 247 Q630 245 600 247" fill="none" stroke="#1e3458" stroke-width="1.5"/>
  <!-- Tower navigation light -->
  <circle cx="748" cy="166" r="3" fill="#f07b2b" fill-opacity="0.95"/>
  <circle cx="748" cy="166" r="7" fill="#f07b2b" fill-opacity="0.18"/>

  <!-- Orange accent line -->
  <rect x="0" y="445" width="800" height="5" fill="#f07b2b"/>

  <!-- Label -->
  <rect x="22" y="22" width="282" height="38" rx="6" fill="#000000" fill-opacity="0.50"/>
  <text x="34" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Power Plant Commissioning</text>
</svg>
